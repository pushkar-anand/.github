name: Go Coverage

on:
  workflow_call:
    inputs:
      build-tags:
        description: "Space-separated Go build tags (e.g. goolm)"
        type: string
        default: ""
      go-version-file:
        description: "Path to go.mod for Go version"
        type: string
        default: "go.mod"

jobs:
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Restore main coverage
        if: github.event_name == 'pull_request'
        id: restore-main
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: main-coverage.out
          key: go-coverage-main-${{ github.sha }}
          restore-keys: go-coverage-main-

      - name: Test with coverage
        run: |
          TAGS="${{ inputs.build-tags }}"
          go test ${TAGS:+-tags "$TAGS"} -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Save main coverage
        if: github.ref == 'refs/heads/main'
        run: cp coverage.out main-coverage.out

      - name: Cache main coverage
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: main-coverage.out
          key: go-coverage-main-${{ github.sha }}

      - name: Post coverage comment
        if: github.event_name == 'pull_request'
        uses: pushkar-anand/.github/.github/actions/go-coverage-comment@main
        with:
          pr-number: ${{ github.event.pull_request.number }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
